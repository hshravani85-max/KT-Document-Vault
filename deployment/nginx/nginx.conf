# =====================================================================
# KHANNA TRAVELS — KT VAULT V3
# NGINX Production Reverse Proxy Configuration (TLS / HTTPS Termination)
# =====================================================================

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Rate Limiting Zone: 10 requests/sec per IP, burst 20
    limit_req_zone $binary_remote_addr zone=vault_limit:10m rate=10r/s;

    # 1. HTTP Port 80 Redirect to HTTPS Port 443
    server {
        listen 80;
        server_name vault.khannatravels.internal localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Hardened HTTPS Server Block
    server {
        listen 443 ssl http2;
        server_name vault.khannatravels.internal localhost;

        # TLS Certificates (Replace with organization certificates)
        ssl_certificate     C:/KT_Vault_V3/certs/vault_server.crt;
        ssl_certificate_key C:/KT_Vault_V3/certs/vault_server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' data: blob:;" always;

        # Streamlit WebSocket and Core Reverse Proxy
        location / {
            limit_req zone=vault_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;

            # WebSocket support for Streamlit state streaming
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Timeouts
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Health Check Route
        location /health {
            proxy_pass http://127.0.0.1:8501/_stcore/health;
            access_log off;
        }
    }
}
